spring:
  application:
    name: app-posting-client-bonuses

  datasource:
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
    url: jdbc:postgresql://localhost:5432/bonus_db
    username: bonus_user
    password: bonus_password
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=10000, expireAfterWrite=60s

resilience4j:
  ratelimiter:
    instances:
      bonus-write-api:
        limit-for-period: 100
        limit-refresh-period: 60s
        timeout-duration: 5s

      bonus-read-api:
        limit-for-period: 1000
        limit-refresh-period: 60s
        timeout-duration: 2s

server:
  port: 8080
  servlet:
    context-path: /api

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
    disable-swagger-default-url: true
    urls:
      - url: /api-docs
        name: Bonus Service API

logging:
  level:
    ru.retail.service: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  observations:
    http:
      server:
        requests:
          enabled: true
  tracing:
    brave:
      trace-id128:
        enabled: true
    enabled: true
    sampling:
      probability: 1
  endpoint:
    metrics:
      enabled: true
  health:
    defaults:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers,liveness,readiness
  server:
    port: 8090
  prometheus:
    metrics:
      export:
        enabled: true